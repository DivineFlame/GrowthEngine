# GrowthEngine Dokploy Ingress Configuration
# This file configures routing, SSL/TLS, rate limiting, and reverse proxy settings
# Use this with Dokploy's Nginx ingress controller or standalone Nginx

# ============================================
# Global Rate Limiting Zones
# ============================================
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;

# ============================================
# Upstream Backends
# ============================================
upstream api_backend {
    least_conn;
    server api:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream webhook_backend {
    least_conn;
    server api:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend_backend {
    least_conn;
    server frontend:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream paperclip_backend {
    least_conn;
    server paperclip-transformer:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ============================================
# HTTP to HTTPS Redirect
# ============================================
server {
    listen 80;
    server_name api.yourdomain.com app.yourdomain.com webhook.yourdomain.com;
    
    # LetsEncrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS API Server (api.yourdomain.com)
# ============================================
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;
    
    # SSL/TLS Configuration
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # HSTS Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
    
    # Client upload limits
    client_max_body_size 110M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;
    gzip_disable "msie6";
    
    # Access logging
    access_log /var/log/nginx/api_access.log combined;
    error_log /var/log/nginx/api_error.log warn;
    
    # ========================================
    # Authentication Endpoints (Strict Rate Limit)
    # ========================================
    location /auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;
        proxy_buffering off;
    }
    
    location /auth/logout {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ========================================
    # Lead CSV Upload (Moderate Rate Limit)
    # ========================================
    location /leads/upload-csv {
        limit_req zone=upload_limit burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 11M;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        
        # Timeout for file upload
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # ========================================
    # Content Upload (Moderate Rate Limit)
    # ========================================
    location /content/upload {
        limit_req zone=upload_limit burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 101M;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        
        # Timeout for large file upload
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    
    # ========================================
    # Webhooks (High Rate Limit)
    # ========================================
    location /webhooks/ {
        limit_req zone=webhook_limit burst=40 nodelay;
        limit_req_status 429;
        
        proxy_pass http://webhook_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ========================================
    # Health Check Endpoint (No Rate Limit)
    # ========================================
    location /health {
        access_log off;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # ========================================
    # General API Routes (Standard Rate Limit)
    # ========================================
    location / {
        limit_req zone=api_limit burst=100 nodelay;
        limit_req_status 429;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;
    }
}

# ============================================
# HTTPS Frontend Server (app.yourdomain.com)
# ============================================
server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;
    
    # SSL/TLS Configuration
    ssl_certificate /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Frontend root and index
    root /var/www/app;
    index index.html;
    
    # Access logging
    access_log /var/log/nginx/app_access.log combined;
    error_log /var/log/nginx/app_error.log warn;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;
    gzip_disable "msie6";
    
    # Cache control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ========================================
    # SPA Fallback (Always serve index.html)
    # ========================================
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        
        # Try file, directory, or fall back to index.html for SPA routing
        try_files $uri $uri/ /index.html;
        
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================
# HTTPS Webhook Server (webhook.yourdomain.com)
# ============================================
server {
    listen 443 ssl http2;
    server_name webhook.yourdomain.com;
    
    # SSL/TLS Configuration
    ssl_certificate /etc/letsencrypt/live/webhook.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webhook.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Webhook-specific logging
    access_log /var/log/nginx/webhook_access.log combined;
    error_log /var/log/nginx/webhook_error.log warn;
    
    # ========================================
    # Webhook Routes (High Rate Limit)
    # ========================================
    location / {
        limit_req zone=webhook_limit burst=40 nodelay;
        limit_req_status 429;
        
        proxy_pass http://webhook_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Webhook timeout
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# ============================================
# Error Pages
# ============================================
error_page 429 @rate_limit;
location @rate_limit {
    default_type application/json;
    return 429 '{"error": "Rate limit exceeded. Please try again later."}';
}

error_page 500 502 503 504 @error;
location @error {
    default_type application/json;
    return 500 '{"error": "Internal server error. Please try again later."}';
}
